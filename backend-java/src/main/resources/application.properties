spring.application.name=pashurakshak-backend
server.port=8080

# File-based H2 so data survives restarts without needing a separate DB server.
# Swap these three lines for a real Postgres URL/user/pass before production use.
spring.datasource.url=jdbc:h2:file:./data/livestockguard;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Absolute path to the compiled C++ risk engine binary.
# Point this at wherever you built cpp-risk-engine/risk_engine (see its README).
livestockguard.risk-engine.path=../cpp-risk-engine/risk_engine

# A case is considered "active" for hotspot aggregation if reported within
# this many days, and a village becomes a hotspot once it has this many
# active HIGH/CRITICAL cases.
livestockguard.hotspot.window-days=14
livestockguard.hotspot.trigger-count=3

# Allow the Vite dev server to call this API during development.
livestockguard.cors.allowed-origin=http://localhost:5173

# Google Places API key — required for the "Find a vet" page to auto-discover
# real veterinary clinics. Get one from https://console.cloud.google.com/
# (enable "Places API", set up billing — small usage stays within Google's
# free monthly credit). Leave blank to disable auto-discovery; manually
# added vets in the Veterinary desk still work without this.
googlemaps.api-key=
googlemaps.places.radius-meters=15000

# Anthropic API key — required for photo-based possible-condition analysis
# on the report form. Get one from https://console.anthropic.com/
# (usage is billed per request). Leave blank to disable; the rest of the
# app works fine without it, the photo-upload UI just stays off.
anthropic.api-key=
anthropic.model=claude-sonnet-5

# When a HIGH/CRITICAL case has a location, auto-assign the nearest
# registered vet within this radius (falls back to a Google-suggested
# clinic if none is close enough and Google Places is configured).
livestockguard.auto-assign.radius-km=100
